
name: Build XRayCore DLL

on:
  workflow_dispatch:

  push:
    branches:
      - master
    paths:
      - 'XRay-Wrapper/go.mod'
      - 'XRay-Wrapper/go.sum'

permissions:
  contents: write

concurrency:
  group: build-xraycore-dll
  cancel-in-progress: false

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    name: Build Windows x64 XRayCore.dll
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true
          cache-dependency-path: XRay-Wrapper/go.mod

      - name: Show Go version
        shell: pwsh
        run: |
          go version

      - name: Update Go dependencies
        shell: pwsh
        working-directory: XRay-Wrapper
        run: |
          # Получаем последний стабильный релиз Xray-core
          $release = Invoke-RestMethod `
            -Uri "https://api.github.com/repos/XTLS/Xray-core/releases/latest" `
            -Headers @{
              "User-Agent" = "InvisibleMan-XRayClient"
              "Accept" = "application/vnd.github+json"
            }

          $tag = $release.tag_name

          if (-not $tag) {
              throw "Could not determine latest Xray-core release"
          }

          Write-Host "Latest Xray-core release: $tag"

          # Получаем точный Git commit релиза
          $lines = git ls-remote `
            https://github.com/XTLS/Xray-core.git `
            "refs/tags/$tag" `
            "refs/tags/$tag^{}"

          if ($LASTEXITCODE -ne 0) {
              throw "Could not resolve Xray-core tag"
          }

          $tagRef = "refs/tags/$tag"
          $peeledRef = "$tagRef^{}"

          $tagSha = $null
          $commitSha = $null

          foreach ($line in $lines) {
              $parts = $line -split '\s+'

              if ($parts.Count -ge 2) {
                  if ($parts[1] -eq $peeledRef) {
                      $commitSha = $parts[0]
                  }
                  elseif ($parts[1] -eq $tagRef) {
                      $tagSha = $parts[0]
                  }
              }
          }

          # Для аннотированного тега используем peeled commit.
          # Для обычного тега используем его собственный SHA.
          if (-not $commitSha) {
              $commitSha = $tagSha
          }

          if (-not $commitSha) {
              throw "Could not resolve Xray-core commit SHA"
          }

          Write-Host "Xray-core commit: $commitSha"

          # Обновляем ядро до конкретного коммита релиза
          go get "github.com/xtls/xray-core@$commitSha"

          if ($LASTEXITCODE -ne 0) {
              throw "Xray-core update failed"
          }

          # Обновляем зависимости
          go mod tidy

          if ($LASTEXITCODE -ne 0) {
              throw "go mod tidy failed"
          }

          # Проверяем фактически подключённую версию
          Write-Host "===== Installed Xray-core version ====="

          go list -m github.com/xtls/xray-core

          if ($LASTEXITCODE -ne 0) {
              throw "Could not verify Xray-core version"
          }

          Write-Host "Successfully updated to $tag"

      - name: Build XRayCore.dll
        shell: pwsh
        working-directory: XRay-Wrapper
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '1'
        run: |
          go build `
            -trimpath `
            -buildmode=c-shared `
            -ldflags="-s -w -buildid=" `
            -o XRayCore.dll .

          if ($LASTEXITCODE -ne 0) {
              throw "XRayCore.dll build failed"
          }

      - name: Verify DLL file
        shell: pwsh
        run: |
          $dll = "XRay-Wrapper/XRayCore.dll"

          if (-not (Test-Path $dll)) {
              throw "XRayCore.dll not found"
          }

          $sizeMB = [math]::Round(
              (Get-Item $dll).Length / 1MB, 2
          )

          Write-Host "XRayCore.dll size: $sizeMB MB"

          if ($sizeMB -lt 5) {
              throw "XRayCore.dll is suspiciously small"
          }

          Write-Host "DLL size check passed."

      - name: Install DLL into application
        shell: pwsh
        run: |
          $source = "XRay-Wrapper/XRayCore.dll"
          $destination = "InvisibleMan-XRay/Libraries/XRayCore.dll"

          if (-not (Test-Path $source)) {
              throw "Built DLL not found: $source"
          }

          if (-not (Test-Path "InvisibleMan-XRay/Libraries")) {
              throw "Application Libraries directory not found"
          }

          Copy-Item $source $destination -Force

          Write-Host "DLL copied to $destination"

      - name: Commit updated Xray core
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "XRay-Wrapper/go.mod"
          git add "XRay-Wrapper/go.sum"
          git add -f "InvisibleMan-XRay/Libraries/XRayCore.dll"

          Write-Host "Git status before commit:"
          git status --short

          if (-not (git diff --cached --quiet)) {
              git commit -m "Update bundled Xray core"

              if ($LASTEXITCODE -ne 0) {
                  throw "Git commit failed"
              }
          }
          else {
              Write-Host "No staged changes to commit"
          }

          # Проверяем чистоту рабочей директории
          $status = git status --porcelain

          if ($LASTEXITCODE -ne 0) {
              throw "Could not inspect Git status"
          }

          if ($status) {
              Write-Host "Remaining working-tree changes:"
              Write-Host $status
              throw "Working tree is not clean"
          }

      - name: Sync with latest master and push
        shell: pwsh
        run: |
          git fetch origin master

          if ($LASTEXITCODE -ne 0) {
              throw "Git fetch failed"
          }

          git rebase origin/master

          if ($LASTEXITCODE -ne 0) {
              throw "Rebase failed. Check conflict details."
          }

          git push origin HEAD:master

          if ($LASTEXITCODE -ne 0) {
              throw "Git push failed"
          }

      - name: Upload XRayCore.dll artifact
        uses: actions/upload-artifact@v4
        with:
          name: XRayCore-current
          path: XRay-Wrapper/XRayCore.dll
          if-no-files-found: error
          retention-days: 30
