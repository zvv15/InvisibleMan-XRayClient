name: Build XRayCore DLL

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true
          cache-dependency-path: XRay-Wrapper/go.mod

      - name: Verify Xray version
        working-directory: XRay-Wrapper
        shell: pwsh
        run: |
          go version
          Write-Host "===== Xray version in go.mod ====="
          Select-String "github.com/xtls/xray-core" go.mod

      - name: Build DLL
        working-directory: XRay-Wrapper
        shell: pwsh
        run: |
          go mod tidy
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          $env:GOOS="windows"
          $env:GOARCH="amd64"

          go build `
            -trimpath `
            -buildmode=c-shared `
            -ldflags="-s -w -buildid=" `
            -o XRayCore.dll .

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Install XRayCore.dll into client
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "InvisibleMan-XRay/Libraries" | Out-Null
          Copy-Item "XRay-Wrapper/XRayCore.dll" "InvisibleMan-XRay/Libraries/XRayCore.dll" -Force

      - name: Commit updated Xray core
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "XRay-Wrapper/go.sum"
          git add -f "InvisibleMan-XRay/Libraries/XRayCore.dll"

          if (git diff --cached --quiet) {
            Write-Host "No repository changes to commit."
            exit 0
          }

          git commit -m "Update bundled Xray core"
          git push

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: XRayCore-current
          path: XRay-Wrapper/XRayCore.dll
