
name: Build and Release XRayCore

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Choose workflow mode"
        type: choice
        required: true
        default: release
        options:
          - release
          - validate

  schedule:
    - cron: '17 4 * * *'

  push:
    branches:
      - master
    paths:
      - 'XRay-Wrapper/go.mod'
      - 'XRay-Wrapper/go.sum'

permissions:
  contents: write

concurrency:
  group: build-xraycore-dll
  cancel-in-progress: false

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    name: Build and Release Windows x64 XRayCore
    runs-on: windows-latest

    steps:

      # ==========================================
      # 1. Checkout repository
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ==========================================
      # 2. Check latest upstream release
      # ==========================================

      - name: Check latest Xray-core release
        id: latest
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_MODE: ${{ inputs.mode }}
        run: |
          $mode = $env:WORKFLOW_MODE

          if ([string]::IsNullOrWhiteSpace($mode)) {
              $mode = "release"
          }

          if ($mode -notin @("release", "validate")) {
              throw "Invalid workflow mode: $mode"
          }

          Write-Host "Workflow mode: $mode"

          # Получаем последний стабильный релиз Xray-core
          $release = Invoke-RestMethod `
            -Uri "https://api.github.com/repos/XTLS/Xray-core/releases/latest" `
            -Headers @{
              "User-Agent" = "InvisibleMan-XRayClient"
              "Accept" = "application/vnd.github+json"
            }

          $tag = [string]$release.tag_name

          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
              throw "Unexpected Xray-core release tag: $tag"
          }

          $version = $tag -replace '^v', ''
          $releaseTag = "xray-$version"

          Write-Host "Latest upstream release: $tag"
          Write-Host "Local release tag: $releaseTag"

          # Validate only:
          # Проверяем текущую версию из go.mod без обновления зависимостей,
          # коммита и публикации Release.

          if ($mode -eq "validate") {
              "skip=false" >> $env:GITHUB_OUTPUT
              "mode=validate" >> $env:GITHUB_OUTPUT
              "version=validation" >> $env:GITHUB_OUTPUT
              "upstream_tag=$tag" >> $env:GITHUB_OUTPUT

              Write-Host "Validation mode selected."
              exit 0
          }

          # Проверяем наличие опубликованного Release
          $existingRelease = $null

          $releaseUrl = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$releaseTag"

          try {
              $existingRelease = Invoke-RestMethod `
                -Uri $releaseUrl `
                -Headers @{
                  "User-Agent" = "InvisibleMan-XRayClient"
                  "Accept" = "application/vnd.github+json"
                  "Authorization" = "Bearer $env:GH_TOKEN"
                }
          }
          catch {
              $statusCode = 0

              if ($_.Exception.Response -and $_.Exception.Response.StatusCode) {
                  $statusCode = [int]$_.Exception.Response.StatusCode
              }

              if ($statusCode -ne 404) {
                  throw "Could not check existing GitHub Release: $_"
              }
          }

          if ($existingRelease) {
              if ($existingRelease.draft) {
                  throw "A draft Release already exists for $releaseTag. Resolve it manually."
              }

              Write-Host "Release $releaseTag already exists."
              Write-Host "Nothing to build."

              "skip=true" >> $env:GITHUB_OUTPUT
              "mode=release" >> $env:GITHUB_OUTPUT

              exit 0
          }

          # Если Release отсутствует, проверяем, не занят ли уже тег
          $existingTag = git ls-remote --refs origin "refs/tags/$releaseTag"

          if ($LASTEXITCODE -ne 0) {
              throw "Could not check existing Git tag"
          }

          if ($existingTag) {
              throw "Git tag $releaseTag exists, but its GitHub Release does not. Manual resolution is required."
          }

          # Получаем точный commit upstream-релиза
          $tagRef = "refs/tags/$tag"
          $peeledRef = "$tagRef^{}"

          $lines = git ls-remote `
            https://github.com/XTLS/Xray-core.git `
            $tagRef `
            $peeledRef

          if ($LASTEXITCODE -ne 0) {
              throw "Could not resolve upstream Xray-core tag"
          }

          $tagSha = $null
          $commitSha = $null

          foreach ($line in $lines) {
              $parts = $line -split '\s+'

              if ($parts.Count -ge 2) {
                  if ($parts[1] -eq $peeledRef) {
                      $commitSha = $parts[0]
                  }
                  elseif ($parts[1] -eq $tagRef) {
                      $tagSha = $parts[0]
                  }
              }
          }

          # Поддержка аннотированных и обычных Git-тегов
          if (-not $commitSha) {
              $commitSha = $tagSha
          }

          if (-not $commitSha) {
              throw "Could not resolve Xray-core commit SHA"
          }

          Write-Host "Xray-core commit: $commitSha"

          "skip=false" >> $env:GITHUB_OUTPUT
          "mode=release" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "upstream_tag=$tag" >> $env:GITHUB_OUTPUT
          "release_tag=$releaseTag" >> $env:GITHUB_OUTPUT
          "commit_sha=$commitSha" >> $env:GITHUB_OUTPUT

      # ==========================================
      # 3. Setup Go
      # ==========================================

      - name: Set up Go
        if: steps.latest.outputs.skip != 'true'
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true
          cache-dependency-path: XRay-Wrapper/go.mod

      - name: Show Go version
        if: steps.latest.outputs.skip != 'true'
        shell: pwsh
        run: |
          go version

      # ==========================================
      # 4. Update Xray-core dependencies
      # ==========================================

      - name: Update Go dependencies
        if: steps.latest.outputs.mode == 'release' && steps.latest.outputs.skip != 'true'
        shell: pwsh
        working-directory: XRay-Wrapper
        env:
          UPSTREAM_COMMIT: ${{ steps.latest.outputs.commit_sha }}
          UPSTREAM_TAG: ${{ steps.latest.outputs.upstream_tag }}
        run: |
          Write-Host "Updating Xray-core to $env:UPSTREAM_TAG"

          go get "github.com/xtls/xray-core@$env:UPSTREAM_COMMIT"

          if ($LASTEXITCODE -ne 0) {
              throw "Xray-core update failed"
          }

          go mod tidy

          if ($LASTEXITCODE -ne 0) {
              throw "go mod tidy failed"
          }

          Write-Host "===== Installed Xray-core version ====="

          go list -m github.com/xtls/xray-core

          if ($LASTEXITCODE -ne 0) {
              throw "Could not verify Xray-core version"
          }

      # ==========================================
      # 5. Run Go tests
      # ==========================================

      - name: Run Go tests
        if: steps.latest.outputs.skip != 'true'
        shell: pwsh
        working-directory: XRay-Wrapper
        env:
          CGO_ENABLED: '1'
        run: |
          go test ./...

          if ($LASTEXITCODE -ne 0) {
              throw "Go tests failed"
          }

          Write-Host "All Go tests passed."

      # ==========================================
      # 6. Run Go vet
      # ==========================================

      - name: Run Go vet
        if: steps.latest.outputs.skip != 'true'
        shell: pwsh
        working-directory: XRay-Wrapper
        env:
          CGO_ENABLED: '1'
        run: |
          go vet ./...

          if ($LASTEXITCODE -ne 0) {
              throw "Go vet failed"
          }

          Write-Host "Go vet passed."

      # ==========================================
      # 7. Build Windows x64 DLL
      # ==========================================

      - name: Build XRayCore.dll
        if: steps.latest.outputs.skip != 'true'
        shell: pwsh
        working-directory: XRay-Wrapper
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '1'
        run: |
          go build `
            -trimpath `
            -buildmode=c-shared `
            -ldflags="-s -w -buildid=" `
            -o XRayCore.dll .

          if ($LASTEXITCODE -ne 0) {
              throw "XRayCore.dll build failed"
          }

          # Удаляем автоматически созданный C header.
          # Для работы приложения он не требуется.

          if (Test-Path "XRayCore.h") {
              Remove-Item "XRayCore.h" -Force
          }

          Write-Host "DLL build completed."

      # ==========================================
      # 8. Verify DLL
      # ==========================================

      - name: Verify XRayCore.dll
        if: steps.latest.outputs.skip != 'true'
        shell: pwsh
        run: |
          $dll = "XRay-Wrapper/XRayCore.dll"

          if (-not (Test-Path $dll)) {
              throw "XRayCore.dll not found"
          }

          $file = Get-Item $dll
          $sizeMB = [math]::Round($file.Length / 1MB, 2)

          Write-Host "DLL size: $sizeMB MB"

          if ($file.Length -lt 5MB) {
              throw "DLL is suspiciously small"
          }

          # Проверка DOS/PE заголовков
          $bytes = [System.IO.File]::ReadAllBytes($dll)

          if ($bytes.Length -lt 0x40) {
              throw "DLL is too small to contain a valid PE header"
          }

          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) {
              throw "Invalid DOS header"
          }

          $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)

          if ($peOffset -lt 0 -or ($peOffset + 6) -gt $bytes.Length) {
              throw "Invalid PE header offset"
          }

          if (
              $bytes[$peOffset] -ne 0x50 -or
              $bytes[$peOffset + 1] -ne 0x45 -or
              $bytes[$peOffset + 2] -ne 0x00 -or
              $bytes[$peOffset + 3] -ne 0x00
          ) {
              throw "Invalid PE signature"
          }

          # IMAGE_FILE_MACHINE_AMD64 = 0x8664
          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)

          if ($machine -ne 0x8664) {
              throw "DLL is not Windows x64"
          }

          $hash = (Get-FileHash $dll -Algorithm SHA256).Hash

          Write-Host "Architecture: Windows x64"
          Write-Host "SHA256: $hash"
          Write-Host "DLL verification passed."

      # ==========================================
      # 9. Install DLL into application
      # ==========================================

      - name: Install DLL into application
        if: steps.latest.outputs.mode == 'release' && steps.latest.outputs.skip != 'true'
        shell: pwsh
        run: |
          $source = "XRay-Wrapper/XRayCore.dll"
          $destination = "InvisibleMan-XRay/Libraries/XRayCore.dll"

          if (-not (Test-Path $source)) {
              throw "Source DLL not found"
          }

          if (-not (Test-Path "InvisibleMan-XRay/Libraries")) {
              throw "Application Libraries directory not found"
          }

          Copy-Item $source $destination -Force

          Write-Host "DLL installed into application."

      # ==========================================
      # 10. Create ZIP archive
      # ==========================================

      - name: Create release archive
        id: package
        if: steps.latest.outputs.skip != 'true'
        shell: pwsh
        env:
          CORE_VERSION: ${{ steps.latest.outputs.version }}
          WORKFLOW_MODE: ${{ steps.latest.outputs.mode }}
        run: |
          $source = "XRay-Wrapper/XRayCore.dll"

          if (-not (Test-Path $source)) {
              throw "DLL not found for packaging"
          }

          if ($env:WORKFLOW_MODE -eq "validate") {
              $archiveName = "XRayCore.validation.zip"
          }
          else {
              $archiveName = "XRay-Core.$env:CORE_VERSION.zip"
          }

          $archive = Join-Path $env:RUNNER_TEMP $archiveName

          Compress-Archive `
              -LiteralPath $source `
              -DestinationPath $archive `
              -CompressionLevel Optimal `
              -Force

          if (-not (Test-Path $archive)) {
              throw "ZIP archive was not created"
          }

          # Проверяем содержимое архива
          Add-Type -AssemblyName System.IO.Compression.FileSystem

          $zip = [System.IO.Compression.ZipFile]::OpenRead($archive)

          try {
              $entry = $zip.Entries |
                  Where-Object { $_.FullName -eq "XRayCore.dll" }

              if (-not $entry) {
                  throw "XRayCore.dll is missing from ZIP archive"
              }

              if ($entry.Length -ne (Get-Item $source).Length) {
                  throw "DLL size inside ZIP does not match source DLL"
              }
          }
          finally {
              $zip.Dispose()
          }

          if ((Get-Item $archive).Length -lt 1KB) {
              throw "ZIP archive is invalid or too small"
          }

          Write-Host "Archive verified: $archive"

          "archive_path=$archive" >> $env:GITHUB_OUTPUT

      # ==========================================
      # 11. Upload Actions artifact
      # ==========================================

      - name: Upload XRayCore artifact
        if: steps.latest.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: XRayCore-${{ steps.latest.outputs.version }}
          path: ${{ steps.package.outputs.archive_path }}
          if-no-files-found: error
          retention-days: 30

      # ==========================================
      # 12. Commit updated DLL and Go dependencies
      # ==========================================

      - name: Commit updated Xray core
        if: steps.latest.outputs.mode == 'release' && steps.latest.outputs.skip != 'true'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "XRay-Wrapper/go.mod"
          git add "XRay-Wrapper/go.sum"
          git add -f "InvisibleMan-XRay/Libraries/XRayCore.dll"

          git diff --cached --quiet
          $diffExit = $LASTEXITCODE

          if ($diffExit -eq 1) {
              git commit -m "Update bundled Xray core"

              if ($LASTEXITCODE -ne 0) {
                  throw "Git commit failed"
              }
          }
          elseif ($diffExit -ne 0) {
              throw "Could not inspect staged changes"
          }
          else {
              Write-Host "No changes to commit."
          }

          # Проверяем рабочую директорию
          $status = git status --porcelain

          if ($LASTEXITCODE -ne 0) {
              throw "Could not inspect Git status"
          }

          if ($status) {
              Write-Host $status
              throw "Working tree is not clean"
          }

      # ==========================================
      # 13. Sync and push master
      # ==========================================

      - name: Sync with latest master and push
        id: push
        if: steps.latest.outputs.mode == 'release' && steps.latest.outputs.skip != 'true'
        shell: pwsh
        run: |
          git fetch origin master

          if ($LASTEXITCODE -ne 0) {
              throw "Git fetch failed"
          }

          git rebase origin/master

          if ($LASTEXITCODE -ne 0) {
              throw "Git rebase failed"
          }

          git push origin HEAD:master

          if ($LASTEXITCODE -ne 0) {
              throw "Git push failed"
          }

          $commitSha = (git rev-parse HEAD).Trim()

          if ($LASTEXITCODE -ne 0 -or -not $commitSha) {
              throw "Could not determine final commit SHA"
          }

          Write-Host "Pushed commit: $commitSha"

          "commit_sha=$commitSha" >> $env:GITHUB_OUTPUT

      # ==========================================
      # 14. Publish GitHub Release
      # ==========================================

      - name: Create GitHub Release
        if: steps.latest.outputs.mode == 'release' && steps.latest.outputs.skip != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.latest.outputs.release_tag }}
          RELEASE_VERSION: ${{ steps.latest.outputs.version }}
          UPSTREAM_TAG: ${{ steps.latest.outputs.upstream_tag }}
          COMMIT_SHA: ${{ steps.push.outputs.commit_sha }}
          ARCHIVE_PATH: ${{ steps.package.outputs.archive_path }}
        run: |
          $notes = @"
          Automatically built and verified Xray Core release.

          Upstream version: $env:UPSTREAM_TAG
          Windows architecture: amd64
          Repository commit: $env:COMMIT_SHA

          Included file:
          - XRayCore.dll

          Installation:
          Replace the existing file:
          Invisible Man XRay\Libraries\XRayCore.dll

          No application executable rebuild is required.
          "@

          gh release create "$env:RELEASE_TAG" `
              "$env:ARCHIVE_PATH" `
              --target "$env:COMMIT_SHA" `
              --title "XRay Core $env:RELEASE_VERSION" `
              --notes "$notes" `
              --latest

          if ($LASTEXITCODE -ne 0) {
              throw "GitHub Release creation failed"
          }

          Write-Host "Release successfully published."
