name: Build XRayCore DLL

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true
          cache-dependency-path: XRay-Wrapper/go.mod

      - name: Build DLL
        working-directory: XRay-Wrapper
        run: |
          go mod tidy
          $env:GOOS="windows"
          $env:GOARCH="amd64"
          go build -buildmode=c-shared -o XRayCore.dll

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: XRayCore
          path: XRay-Wrapper/XRayCore.dll
