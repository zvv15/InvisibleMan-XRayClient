name: Build XRayCore DLL

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
          cache-dependency-path: XRay-Wrapper/go.mod

      - name: Update Xray core
        working-directory: XRay-Wrapper
        shell: pwsh
        run: |
          go version

          go get github.com/xtls/xray-core@master
          go mod tidy

          Write-Host "===== Xray version in go.mod ====="
          Select-String "github.com/xtls/xray-core" go.mod

      - name: Build DLL
        working-directory: XRay-Wrapper
        shell: pwsh
        run: |
          $env:GOOS="windows"
          $env:GOARCH="amd64"

          go build `
            -trimpath `
            -buildmode=c-shared `
            -ldflags="-s -w -buildid=" `
            -o XRayCore.dll .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: XRayCore-test
          path: XRay-Wrapper/XRayCore.dll
