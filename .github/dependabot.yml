version: 2

updates:
  - package-ecosystem: "gomod"
    directory: "/XRay-Wrapper"

    schedule:
      interval: "daily"

    open-pull-requests-limit: 5

    labels:
      - "dependencies"
      - "go"

    commit-message:
      prefix: "chore(deps)"

    ignore:
      - dependency-name: "github.com/xtls/xray-core"
